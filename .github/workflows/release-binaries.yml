name: Release binaries

on:
  workflow_run:
    workflows: ["Release wheel"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to attach binaries to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-binaries-${{ github.event.workflow_run.head_branch || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }} executable
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x86_64
            suffix: ""
          - runner: windows-latest
            target: windows-x86_64
            suffix: ".exe"
          - runner: macos-13
            target: macos-x86_64
            suffix: ""
          - runner: macos-14
            target: macos-arm64
            suffix: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify checked out tag
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          if [[ -n "$EXPECTED_SHA" ]]; then
            test "$EXPECTED_SHA" = "$(git rev-parse HEAD)"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: make deps

      - name: Build executable
        run: make binary

      - name: Smoke test executable
        shell: bash
        env:
          BINARY_SUFFIX: ${{ matrix.suffix }}
        run: ./dist/pomelo-pw${BINARY_SUFFIX} --help >/dev/null

      - name: Prepare release asset
        shell: bash
        env:
          BINARY_SUFFIX: ${{ matrix.suffix }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "./dist/pomelo-pw${BINARY_SUFFIX}" "./release-assets/pomelo-pw-${TARGET}${BINARY_SUFFIX}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach binaries to Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.workflow_run.head_branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum ./* > SHA256SUMS

      - name: Upload binaries to GitHub Release
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
