name: scripted-page-check
description: Extract page evidence with a browser function and save its result.
output_dir: "output"
headless: false

variables:
  base_url: "https://the-internet.herokuapp.com"

steps:
  - type: navigate
    url: "{{base_url}}"

  - type: evaluate
    script: |
      () => {
        const title = document.title;
        const heading = document.querySelector('h1')?.textContent?.trim() ?? null;
        return {title, heading, url: window.location.href};
      }
    save_as: evidence

  - type: screenshot
    file: "scripted-page-check/evidence.png"
