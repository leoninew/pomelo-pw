name: spa-readiness
description: Wait for a public page to reach stable network, animation, and route states.
output_dir: "output"
headless: false

variables:
  base_url: "https://the-internet.herokuapp.com"

steps:
  - type: navigate
    url: "{{base_url}}"

  - type: wait
    selector: "h1"
    state: visible
    timeout: 5000

  - type: wait
    network_idle: true
    timeout: 10000

  - type: wait
    animation_stable: true
    timeout: 5000

  - type: wait
    route_stable: true
    route_stable_duration: 500
    timeout: 5000

  - type: screenshot
    file: "spa-readiness/ready.png"
