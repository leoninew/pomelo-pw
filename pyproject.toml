[project]
name = "pomelo-pw"
version = "0.3.1"
description = "Flow-based UI automation tool powered by Playwright"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
visual = [
    "pillow>=10.0.0",
]

[project.scripts]
pomelo-pw = "pomelo_pw.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pomelo_pw"]

[tool.hatch.build.targets.sdist]
include = ["src/pomelo_pw"]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "pytest>=9.0.2",
    "types-pyyaml>=6.0.12.20260518",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0,<8.0.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
